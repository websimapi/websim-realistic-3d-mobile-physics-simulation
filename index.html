<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Realistic 3D Mobile Physics Simulation</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Import map to resolve bare module specifiers like "three" -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.150.0/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="control-panel">
      <h3>Physics Controls</h3>
      <label for="gravity-slider">Gravity (m/s²)</label>
      <input id="gravity-slider" type="range" min="0" max="20" value="9.82" step="0.1" />
      <label for="spawn-interval">Spawn Interval (ms)</label>
      <input id="spawn-interval" type="number" min="100" max="5000" value="1500" step="100" />
      <button id="spawn-button">Spawn Object</button>
    </div>
    <!-- The simulation canvas will be injected into the body by Three.js -->
    <script type="module" src="main.js"></script>
